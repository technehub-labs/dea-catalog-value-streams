    supports:
    - CR-VS-12 candidates (alert-to-report, remediation chains)
  evidence_note: Category-level structure only
- id: SRC-013
  name: Retail / consumer-commerce chains (public structure)
  class: industry-reference-model
  reference: GS1 / retail practitioner public material; category-level structure
  retrieved: 2026-10-28
  retrieval: indirect (public material; category-level structure)
  observations:
  - observation: 'Retail carries canonical chains: assortment-to-shelf (planning through in-stock),
      checkout-to-fulfillment (omnichannel), and markdown/settlement through supplier reconciliation'
    supports:
    - CR-VS-12 retail candidates (assortment-to-shelf, checkout-to-fulfillment, supplier-reconciliation)
  evidence_note: Category-level structure only
- id: SRC-014
  name: Public-sector service chains (permits, grants, benefits; public structure)
