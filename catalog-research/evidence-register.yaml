register_version: 0.4.0
cr: 'CR-VS-01 (candidate universe seed; evidence-register v0.1) + CR-VS-04 (second-tranche evidence: SRC-002
  APQC category observations extended; SRC-003 stakeholder-value observation added) + CR-VS-05 (third-tranche
  evidence: SRC-006 chain-inventory observation added)'
compiled: '2026-10-27 (v0.1: register opened with the value-architecture source corpus; SRC-001..SRC-006
  recorded; candidate universe v0.1 seeded from the register); 2026-10-27 (v0.2 per CR-VS-04: SRC-002
  extended with product-development, planning, and reporting category observations; SRC-003 extended with
  the stakeholder-value observation; VSC-004/005/008/009 evidence strengthened to three-source convergence));
  2026-10-27 (v0.3 per CR-VS-05: SRC-006 extended with reverse-logistics, subscription-renewal, and asset-lifecycle
  chain observations; VSC-011/012/013 seeded at E3/high)"'
compiled_by: Emmanuel A. Otchere
status: active; candidate universe seeded; no admissions yet
source_classes:
- business-architecture
- enterprise-architecture
- cross-industry-process
- standards-body
- professional-body
- commercial-process-models
- industry-reference-model
sources:
- id: SRC-001
  name: Business Architecture Guild / BIZBOK Guide (value stream concept)
  class: business-architecture
  reference: https://www.businessarchitectureguild.org/page/002 (public resources); BIZBOK v13 (membership-gated)
  retrieved: 2026-10-27
  retrieval: indirect (public value-stream guidance; primary BIZBOK text is membership-gated)
  observations:
  - observation: 'Value stream defined as: an end-to-end collection of value-creating activities that
      deliver value to a customer or stakeholder, described independently of the organization units and
      systems that realize it'
    supports:
    - VS identity: activities collected end-to-end; customer value at the exit
    implication: End-to-end scope and value-outcome anchoring become classification tests for candidates
      (vs. single processes, which are internal means)
  - observation: Value streams cross multiple capabilities and are triggered by a customer-visible event
      (a request or need)
    supports:
    - VS entry_criterion field (metamodel CR-MET-014 field set)
    implication: A candidate without a customer-visible trigger is a process, not a value stream
  evidence_note: Strong semantic authority for value stream identity; names never to be copied verbatim
    into canonical entries
- id: SRC-002
  name: APQC Process Classification Framework (cross-industry, process-to-value-stream groupings)
  class: cross-industry-process
  reference: https://www.apqc.org/process-classification-framework (download-gated)
  retrieved: 2026-10-27
  retrieval: indirect (category-level structure via public overview pages)
  observations:
  - observation: Cross-industry PCF groups operating processes into end-to-end chains such as order-to-cash
      concepts, procure-to-pay concepts, and plan-produce-deliver concepts
    supports:
    - VSC-001 Order to Cash; VSC-002 Procure to Pay; VSC-005 Plan-Produce-Deliver candidates
    implication: Cross-industry end-to-end chains corroborate enterprise-generality for the operational
      candidates
  - observation: 'APQC PCF carries end-to-end category structure beyond the operational chains: product/service
      development categories (concept-through-launch), financial planning and analysis categories (planning-through-forecast),
      and financial reporting categories (record-through-report)'
    supports:
    - VSC-004 Concept to Launch; VSC-005 Plan to Deliver; VSC-008 Plan to Forecast; VSC-009 Record to
      Report
    implication: Cross-industry category structure corroborates enterprise-generality for the second-tranche
      candidates (CR-VS-04 evidence work)
  evidence_note: Category-level structure only; APQC is process-class, so candidates must be re-anchored
    on value-outcome rather than process steps
- id: SRC-003
  name: OMG Business Architecture Core Metamodel (BACM) — ValueStream element
  class: standards-body
  reference: https://www.omg.org/spec/BACM/ (formal specification)
  retrieved: 2026-10-27
  retrieval: direct (publicly downloadable formal specification)
  observations:
  - observation: BACM models a ValueStream as delivering value to a stakeholder, decomposed into ValueStreamStages,
      each adding value toward the outcome
    supports:
    - VS outcome field; exit_criterion field
    implication: Stage decomposition is upstream of the stream identity; stages are a later refinement
      (ValueStage entity deferred per CR-MET-007 section 4)
  - observation: BACM anchors value delivery to stakeholders generally, not only external customers; a
      value stream may deliver value to an internal stakeholder such as enterprise governance
    supports:
    - VSC-008 Plan to Forecast; VSC-009 Record to Report (served party is the enterprise itself as governance
      stakeholder)
    implication: The stakeholder-value framing resolves the internal-chain scope question for the finance-side
      candidates (CR-VS-04)
  evidence_note: Standards-body anchor for the formal semantics; stage vocabulary deliberately deferred
- id: SRC-004
  name: 'The Open Group / TOGAF Series Guide: Value Streams and Capabilities'
  class: enterprise-architecture
  reference: https://pubs.opengroup.org/togaf/toafa.html (companion guides overview)
  retrieved: 2026-10-27
  retrieval: indirect (series guide structure via public overview)
  observations:
  - observation: 'TOGAF pairs value streams with capabilities: a value stream describes how value flows
      end-to-end; capabilities describe what the enterprise must be able to do to support it'
    supports:
    - dea:aggregates relationship (VS source, BusinessCapability target; metamodel cardinality 0..*)
    - VS aggregated_capability_refs record field
    implication: Candidates must name the capabilities they span at admission time; capability ids resolve
      against dea-catalog-business-capabilities
  evidence_note: Corroborates the metamodel's aggregates binding between VS and capabilities
- id: SRC-005
  name: Scrum.org / Scaled Agile public guidance on value streams in delivery organizations
  class: professional-body
  reference: https://www.scaledagileframework.com/value-streams/ (public glossary)
  retrieved: 2026-10-27
  retrieval: direct (public glossary pages)
  observations:
  - observation: Operational value streams are the series of steps used to create and deliver value to
      a customer; development value streams produce solutions that improve operational value streams
    supports:
    - 'Distinctness boundary: development/delivery improvement streams are out of scope for first-order
      enterprise value streams (they are second-order)'
    implication: Candidates stay on the operational side; the development-stream concept is recorded as
      disambiguation evidence, not a candidate
  evidence_note: Disambiguation authority for the operational vs. development distinction
- id: SRC-006
  name: Hammer & Hurdle-style enterprise process-chain literature (public summaries)
  class: commercial-process-models
  reference: public practitioner literature on end-to-end business processes (order-to-cash, procure-to-pay,
    issue-to-resolve, lead-to-cash)
  retrieved: 2026-10-27
  retrieval: indirect (practitioner summaries)
  observations:
  - observation: 'Enterprise literature consistently names the same end-to-end chains across industries:
      concept-to-launch, order-to-cash, procure-to-pay, issue-to-resolve, hire-to-retire, lead-to-cash,
      plan-to-forecast'
    supports:
    - VSC-001..VSC-009 candidate names and enterprise-generality
    implication: Cross-source name convergence supports candidate confidence but admission still requires
      per-candidate evidence at E2+
  - observation: 'Practitioner literature extends the end-to-end chain inventory with three further cross-industry
      chains: reverse-logistics chains (return initiation through credit settlement), subscription-economy
      relationship chains (contract execution through renewal settlement), and asset-lifecycle chains
      (asset acquisition through disposal)'
    supports:
    - VSC-011 Return to Credit; VSC-012 Contract to Renewal; VSC-013 Acquire to Retire
    implication: The chain inventory is not exhausted by the operational and finance chains; customer-continuity
      and asset-lifecycle chains are first-order too (CR-VS-05 third tranche)
  evidence_note: Convergence evidence for the candidate universe; not a substitute for per-candidate source
    citations at admission
- id: SRC-007
  name: Healthcare industry reference models (patient-access and revenue-cycle chains, public structure)
  class: industry-reference-model
  reference: HIMSS / healthcare revenue-cycle public guidance; category-level chain structure
  retrieved: 2026-10-28
  retrieval: indirect (public practitioner and industry-body material; category-level structure)
  observations:
  - observation: 'Healthcare carries canonical chains absent from the cross-industry corpus: patient
      access (referral/scheduling through admission), admission-to-discharge (care delivery episode),
      discharge through final billing (revenue cycle back end), and referral-to-treatment'
    supports:
    - CR-VS-12 healthcare candidates (patient-access, admission-to-discharge, discharge-to-bill,
      referral-to-treatment)
    implication: Industry chains are first-class catalog records under the CR-VS-11 applicability dimension
  evidence_note: Category-level structure only; no vendor- or membership-gated text reproduced
- id: SRC-008
  name: Banking industry reference models (lending and payments chains, public structure)
  class: industry-reference-model
  reference: BIAN service landscape public material; SWIFT public process material; category-level structure
  retrieved: 2026-10-28
  retrieval: indirect (public industry-body material; category-level structure)
  observations:
  - observation: 'Banking carries canonical chains: loan origination (application through booking),
      account opening / onboarding (application through KYC-cleared activation), payment execution
      (initiation through settlement and reconciliation), and deposit-to-maturity'
    supports:
    - CR-VS-12 banking candidates (application-to-book, onboard-to-activate, initiate-to-settle,
      deposit-to-maturity)
  evidence_note: Category-level structure only
- id: SRC-009
  name: Insurance industry reference models (policy and claims lifecycles, public structure)
  class: industry-reference-model
  reference: ACORD / insurance practitioner public material; category-level structure
  retrieved: 2026-10-28
  retrieval: indirect (public industry-body material; category-level structure)
  observations:
  - observation: 'Insurance carries canonical chains: quote-to-bind (submission through bound policy),
      first-notice-of-loss to claim settlement, and policy administration through endorsement/renewal'
    supports:
    - CR-VS-12 insurance candidates (quote-to-bind, loss-to-claim-settlement, policy-to-endorsement)
  evidence_note: Category-level structure only
- id: SRC-010
  name: Telecommunications industry reference models (eTOM category-level structure)
  class: industry-reference-model
  reference: TM Forum eTOM public overview material; category-level structure
  retrieved: 2026-10-28
  retrieval: indirect (public overview pages; category-level structure)
  observations:
  - observation: 'Telecom carries canonical chains: order-to-activation (customer order through service
      activation), trouble-to-restore (fault report through service restoration), and
      provisioning-to-billing-alignment'
    supports:
    - CR-VS-12 telecom candidates (order-to-activation, trouble-to-restore, usage-to-bill)
  evidence_note: Category-level structure only; eTOM names not reproduced verbatim
- id: SRC-011
  name: Utilities industry reference models (metering and retail-energy chains, public structure)
  class: industry-reference-model
  reference: Utility industry public guidance; category-level structure
  retrieved: 2026-10-28
  retrieval: indirect (public material; category-level structure)
  observations:
  - observation: 'Utilities carry canonical chains: meter-to-bill (consumption through accurate billing),
      connection request through energization, and outage notification through restoration'
    supports:
    - CR-VS-12 utility candidates (meter-to-bill, apply-to-connect, outage-to-restore)
  evidence_note: Category-level structure only
- id: SRC-012
  name: Financial-crime and regulatory operations chains (public structure)
  class: industry-reference-model
  reference: Public regulatory-practice material (financial-crime prevention, AML practice)
  retrieved: 2026-10-28
  retrieval: indirect (public material; category-level structure)
  observations:
  - observation: 'Regulated financial institutions carry canonical chains for suspicious-activity handling
