candidates:
- id: VSC-001
  name: Order to Cash
  classification: VALUE-STREAM
  confidence: high
  evidence_strength: E3
  entry_criterion_hypothesis: A customer need converts to an order (request for goods or services); demand
    generation is the pre-order stage (per CR-VS-02 RES-001).
  exit_criterion_hypothesis: The customer receives the fulfilled order and the enterprise recognizes payment
    against it.
  outcome_hypothesis: Fulfilled customer need and recognized revenue.
  spans_capabilities:
  - customer-management
  - operations
  - financial-stewardship
  sources:
  - SRC-002
  - SRC-006
  distinctness_notes: 'End-to-end chain, not a single process; spans demand generation (pre-order stage),
    order capture, fulfillment, invoicing, settlement. Absorbs VSC-007 (Lead to Cash) per CR-VS-02 RES-001:
    same exit, entry-only difference failed the two-axis test.'
