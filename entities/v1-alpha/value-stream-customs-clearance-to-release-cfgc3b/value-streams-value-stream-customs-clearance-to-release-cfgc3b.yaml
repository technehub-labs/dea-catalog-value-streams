id: value-streams:value-stream-customs-clearance-to-release-cfgc3b
type: ValueStream
name: Customs Clearance to Release
definition: The customs stream from declaration filing through assessment and inspection to released cargo.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: governance
applicability:
  industries:
  - logistics-transportation
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: Customs-released cargo with duties settled.
entry_criterion: A shipment requires customs clearance.
exit_criterion: The cargo is released and duties settled.
scope:
  includes:
  - Declaration filing
  - Assessment and inspection
  - Release and duty settlement
  excludes:
  - Freight movement (Ship to Consignee)
  - Trade compliance governance
value_stages:
- name: File Declaration
  definition: File the customs declaration.
  entry_criterion: A shipment requires clearance.
  exit_criterion: The declaration is filed.
  outcome: A filed declaration.
  capability_refs:
