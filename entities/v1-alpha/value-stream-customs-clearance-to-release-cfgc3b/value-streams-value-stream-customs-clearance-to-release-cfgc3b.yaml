  customer_visible: false
- name: Assess and Inspect
  definition: Assess and inspect if selected.
  entry_criterion: The declaration is filed.
  exit_criterion: Assessment completes.
  outcome: A completed assessment.
  capability_refs:
  - capabilities:capability-regulation-management-gya4d8
  - capabilities:capability-risk-management-h9uxdw
  process_refs:
  - processes:process-ge-operate-zwaes5
  customer_visible: false
- name: Release and Settle
  definition: Release the cargo and settle duties.
  entry_criterion: Assessment completes.
  exit_criterion: The cargo is released.
  outcome: Released cargo.
  capability_refs:
