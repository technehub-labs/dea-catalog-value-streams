id: value-streams:value-stream-drug-safety-label-to-update-nkcs8f
type: ValueStream
name: Drug Safety Label to Update
definition: The labeling stream from safety evidence accumulation through label change decision to updated
  approved label.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: governance
applicability:
  industries:
  - life-sciences
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: An updated, approved product label reflecting current safety evidence.
entry_criterion: New safety evidence accumulates.
exit_criterion: The approved label is updated.
scope:
  includes:
  - Evidence assessment
  - Label change decision
  - Approved update
  excludes:
  - Pharmacovigilance (Adverse Event to Signal)
  - Regulatory dossiers
value_stages:
- name: Assess Evidence
  definition: Assess the accumulated safety evidence.
  entry_criterion: Evidence accumulates.
  exit_criterion: The assessment is complete.
  outcome: A completed assessment.
  capability_refs:
  - capabilities:capability-risk-management-h9uxdw
  - capabilities:capability-insight-management-ms4n9d
  process_refs:
  - processes:process-sd-operate-ucxpz4
  customer_visible: false
- name: Decide Label Change
  definition: Decide the label change.
  entry_criterion: The assessment is complete.
  exit_criterion: The decision is made.
  outcome: A made decision.
  capability_refs:
  - capabilities:capability-regulation-management-gya4d8
  - capabilities:capability-enterprise-governance-uas48u
  process_refs:
  - processes:process-ge-design-kpsj5b
  customer_visible: false
- name: Update Approved Label
  definition: Implement the approved label update.
  entry_criterion: The decision is made.
  exit_criterion: The label is updated.
  outcome: An updated label.
  capability_refs:
  - capabilities:capability-regulation-management-gya4d8
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-fa-operate-8vqvkk
  customer_visible: false
