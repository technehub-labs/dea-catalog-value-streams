id: value-streams:value-stream-customer-remediation-to-current-krrxzb
type: ValueStream
name: Customer Remediation to Current
definition: The due-diligence remediation stream from an identified KYC/due-diligence backlog item through
  customer engagement to a current compliance status.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: governance
applicability:
  industries:
  - financial-services
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: All due-diligence records current or the relationship exited.
entry_criterion: A due-diligence review falls due or is flagged.
exit_criterion: The customer file is current or the relationship is exited.
scope:
  includes:
  - Backlog identification
  - Customer engagement and document collection
  - Assessment and status update
  - Escalation or exit where unresolved
  excludes:
  - New-customer onboarding (Onboard to Activate)
  - Financial-crime alert handling (Alert to Report)
value_stages:
- name: Identify Backlog
  definition: Identify and prioritize due-diligence backlog.
  entry_criterion: A review falls due.
  exit_criterion: The backlog item is prioritized.
  outcome: A prioritized backlog item.
  capability_refs:
  - capabilities:capability-risk-management-h9uxdw
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-ge-operate-tpenm6
  customer_visible: false
- name: Engage Customer
  definition: Engage the customer for updated information and documents.
  entry_criterion: The item is prioritized.
  exit_criterion: Required information is collected.
  outcome: A complete remediation file.
  capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
- name: Assess and Update
  definition: Assess the file and update the compliance status.
  entry_criterion: Information is collected.
  exit_criterion: The status is updated.
  outcome: A current compliance status.
  capability_refs:
  - capabilities:capability-risk-management-h9uxdw
  - capabilities:capability-regulation-management-gya4d8
  process_refs:
  - processes:process-ge-operate-zwaes5
  customer_visible: false
- name: Escalate or Exit
  definition: Escalate or exit the unresolved relationship.
  entry_criterion: Assessment fails.
  exit_criterion: The relationship is escalated or exited.
  outcome: A dispositioned relationship.
  capability_refs:
  - capabilities:capability-risk-management-h9uxdw
  - capabilities:capability-legal-matter-management-zzbd2u
  process_refs:
  - processes:process-ge-operate-tpenm6
  customer_visible: false
aggregated_capability_refs:
- capabilities:capability-risk-management-h9uxdw
- capabilities:capability-information-management-6vjgdh
- capabilities:capability-customer-management-f3n8wb
- capabilities:capability-regulation-management-gya4d8
- capabilities:capability-legal-matter-management-zzbd2u
metrics:
- name: KYC remediation backlog ratio
  definition: Backlogged files as a share of the portfolio.
evidence:
  sources:
  - SRC-012
  rationale: Admitted under CR-VS-12 (population tranche; candidate VSC-028) from the CR-VS-11 industry
    evidence register extension. Industry-specific chain (financial-services); distinct from cross-industry
    streams by applicability (CR-VS-11 method note); cross-catalog references resolve against the sibling
    catalogs per the referential-integrity gate.
provenance:
  ladder_passage:
