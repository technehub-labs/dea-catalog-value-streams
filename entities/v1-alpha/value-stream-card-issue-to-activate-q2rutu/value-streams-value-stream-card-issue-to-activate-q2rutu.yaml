id: value-streams:value-stream-card-issue-to-activate-q2rutu
type: ValueStream
name: Card Issue to Activate
definition: The end-to-end card stream from card application through production, secure delivery, and
  cardholder activation.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - financial-services
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: An activated card in the cardholder's hands.
entry_criterion: A card application is approved.
exit_criterion: The card is received and activated by the cardholder.
scope:
  includes:
  - Card production
  - Secure delivery
  - Activation
  excludes:
  - Account onboarding (Onboard to Activate)
  - Card payment processing (Initiate to Settle)
value_stages:
- name: Produce Card
  definition: Produce and personalize the card.
  entry_criterion: A card application is approved.
  exit_criterion: The card is produced.
  outcome: A personalized card.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  - capabilities:capability-technology-management-maus5n
  process_refs:
  - processes:process-eo-build-j9z3q4
  customer_visible: false
- name: Deliver Securely
  definition: Deliver the card through secure channels.
  entry_criterion: The card is produced.
  exit_criterion: The card is delivered to the cardholder.
  outcome: A delivered card.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  - capabilities:capability-customer-management-f3n8wb
  process_refs:
  - processes:process-eo-operate-zh9m57
  customer_visible: true
- name: Activate
  definition: Authenticate and activate the card with the cardholder.
  entry_criterion: The card is delivered.
  exit_criterion: The card is activated.
  outcome: An activated card.
  capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  - capabilities:capability-security-management-wmzc7c
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
aggregated_capability_refs:
- capabilities:capability-operations-management-pm3w8k
- capabilities:capability-technology-management-maus5n
- capabilities:capability-customer-management-f3n8wb
- capabilities:capability-security-management-wmzc7c
metrics:
- name: Card issuance cycle time
  definition: Elapsed days from approval to activation.
evidence:
  sources:
  - SRC-008
  rationale: Admitted under CR-VS-12 (population tranche; candidate VSC-026) from the CR-VS-11 industry
    evidence register extension. Industry-specific chain (financial-services); distinct from cross-industry
    streams by applicability (CR-VS-11 method note); cross-catalog references resolve against the sibling
    catalogs per the referential-integrity gate.
provenance:
