id: value-streams:value-stream-order-to-activation-uxqth5
type: ValueStream
name: Order to Activation
definition: The end-to-end telecom fulfilment stream from customer order through service design, provisioning,
  and activation.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - telecommunications
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: An activated service for the customer.
entry_criterion: A customer order for service is accepted.
exit_criterion: The service is activated and confirmed to the customer.
scope:
  includes:
  - Order capture and validation
  - Service design and feasibility
  - Provisioning and configuration
  - Activation and confirmation
  excludes:
  - Billing (Usage to Bill)
  - Fault handling (Trouble to Restore)
value_stages:
- name: Capture Order
  definition: Capture and validate the service order.
  entry_criterion: An order is accepted.
  exit_criterion: The order is validated.
  outcome: A validated order.
  capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
- name: Design Service
  definition: Design the service and check feasibility.
  entry_criterion: The order is validated.
  exit_criterion: The service design is approved.
  outcome: An approved design.
  capability_refs:
  - capabilities:capability-technology-management-maus5n
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-design-6j5mxp
  customer_visible: false
- name: Provision
  definition: Provision network resources and configure the service.
  entry_criterion: The design is approved.
  exit_criterion: The service is provisioned.
  outcome: A provisioned service.
  capability_refs:
  - capabilities:capability-technology-enablement-y6nkws
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-build-j9z3q4
  customer_visible: false
- name: Activate
  definition: Activate and confirm the service.
  entry_criterion: The service is provisioned.
  exit_criterion: The service is activated and confirmed.
  outcome: An activated service.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  - capabilities:capability-customer-management-f3n8wb
  process_refs:
  - processes:process-eo-operate-2jnz85
  customer_visible: true
aggregated_capability_refs:
- capabilities:capability-customer-management-f3n8wb
- capabilities:capability-information-management-6vjgdh
- capabilities:capability-technology-management-maus5n
- capabilities:capability-operations-management-pm3w8k
- capabilities:capability-technology-enablement-y6nkws
upstream_refs:
- slug: value-stream-order-to-cash
  note: Activation is the telecom specialization of order fulfilment; charging follows.
downstream_refs:
- slug: value-stream-usage-to-bill
  note: Activated services start metered usage.
metrics:
- name: Provisioning cycle time
  definition: Elapsed time from order to activation.
  metric_ref: dea:metric-provisioning-cycle-time-telecom
  applies_to_stage: Activate
evidence:
  sources:
  - SRC-010
  rationale: Admitted under CR-VS-12 (population tranche; candidate VSC-036) from the CR-VS-11 industry
    evidence register extension. Industry-specific chain (telecommunications); distinct from cross-industry
    streams by applicability (CR-VS-11 method note); cross-catalog references resolve against the sibling
    catalogs per the referential-integrity gate.
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-10-28'
    actor: Emmanuel A. Otchere, candidate universe v0.6 (CR-VS-12)
  - stage: admitted
    date: '2026-10-28'
    actor: Emmanuel A. Otchere, admission CR-VS-12
process_refs:
- processes:process-pr-operate-bbe384
- processes:process-eo-design-6j5mxp
- processes:process-eo-build-j9z3q4
- processes:process-eo-operate-2jnz85
