id: value-streams:value-stream-adverse-event-to-signal-8ga6be
type: ValueStream
name: Adverse Event to Signal
definition: The pharmacovigilance stream from adverse-event intake through case processing to signal detection
  and reporting decision.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: governance
applicability:
  industries:
  - life-sciences
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: A documented signal assessment and reporting decision for every validated case.
entry_criterion: An adverse event is reported.
exit_criterion: The case is processed and the signal decision recorded.
scope:
  includes:
  - Case intake and validation
  - Case processing and assessment
  - Signal detection and reporting
  excludes:
  - Clinical trials safety
  - Regulatory filings
value_stages:
- name: Intake Case
  definition: Intake and validate the adverse-event case.
  entry_criterion: An event is reported.
  exit_criterion: The case is validated.
  outcome: A validated case.
  capability_refs:
  - capabilities:capability-information-management-6vjgdh
  - capabilities:capability-risk-management-h9uxdw
  process_refs:
  - processes:process-ge-operate-tpenm6
  customer_visible: true
- name: Process Case
  definition: Process and assess the case.
  entry_criterion: The case is validated.
  exit_criterion: The case assessment is complete.
  outcome: A completed assessment.
  capability_refs:
  - capabilities:capability-risk-management-h9uxdw
  - capabilities:capability-legal-matter-management-zzbd2u
  process_refs:
  - processes:process-ge-operate-zwaes5
  customer_visible: false
- name: Detect and Report Signal
  definition: Run signal detection and decide reporting.
  entry_criterion: Assessment data accumulates.
  exit_criterion: The signal decision is recorded.
  outcome: A recorded decision.
  capability_refs:
