id: value-streams:value-stream-warehouse-inbound-to-bin-b67zvk
type: ValueStream
name: Warehouse Inbound to Bin
definition: The warehousing stream from carrier arrival through receiving and putaway to bin-confirmed
  stock.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: support
applicability:
  industries:
  - logistics-transportation
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: Bin-confirmed, system-visible received stock.
entry_criterion: A carrier arrives with inbound freight.
exit_criterion: Stock is confirmed in its bin locations.
scope:
  includes:
  - Receiving
  - Quality and quantity check
  - Putaway and bin confirmation
  excludes:
  - Freight (Ship to Consignee)
  - Order fulfilment pick (Checkout to Fulfillment)
value_stages:
- name: Receive
  definition: Receive the inbound freight.
  entry_criterion: A carrier arrives.
  exit_criterion: The freight is received.
  outcome: Received freight.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-zwzmbd
  customer_visible: false
- name: Check
  definition: Check quantity and condition.
  entry_criterion: The freight is received.
  exit_criterion: The check is complete.
  outcome: Checked stock.
  capability_refs:
  - capabilities:capability-risk-management-h9uxdw
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-eo-operate-44jsrp
  customer_visible: false
- name: Put Away
  definition: Put away and confirm bin locations.
  entry_criterion: The check is complete.
  exit_criterion: Stock is bin-confirmed.
  outcome: Bin-confirmed stock.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-zwzmbd
  customer_visible: false
aggregated_capability_refs:
- capabilities:capability-operations-management-pm3w8k
- capabilities:capability-risk-management-h9uxdw
- capabilities:capability-information-management-6vjgdh
metrics:
- name: Dock-to-stock time
  definition: Elapsed hours from arrival to bin-confirmed stock.
