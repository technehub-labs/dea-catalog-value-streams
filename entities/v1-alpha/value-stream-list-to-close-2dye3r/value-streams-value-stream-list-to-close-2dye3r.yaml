id: value-streams:value-stream-list-to-close-2dye3r
type: ValueStream
name: List to Close
definition: The real-estate transaction stream from listing agreement through marketing and negotiation
  to closed sale.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - construction-real-estate
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: A closed property sale with settled proceeds.
entry_criterion: A listing agreement is signed.
exit_criterion: The sale closes with settled proceeds.
scope:
  includes:
  - Listing preparation
  - Marketing and viewings
  - Offer negotiation
  - Closing and settlement
  excludes:
  - Property management (Lease Sign to Renewal)
  - Financing (lending streams)
value_stages:
- name: Prepare Listing
  definition: Prepare and launch the listing.
  entry_criterion: A listing is signed.
  exit_criterion: The listing is live.
  outcome: A live listing.
  capability_refs:
  - capabilities:capability-marketing-xmc539
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-pr-build-nygvw7
  customer_visible: true
- name: Market and Show
  definition: Market the property and conduct viewings.
  entry_criterion: The listing is live.
  exit_criterion: Offers are received.
  outcome: Received offers.
  capability_refs:
  - capabilities:capability-marketing-xmc539
  - capabilities:capability-customer-management-f3n8wb
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
- name: Negotiate Offer
  definition: Negotiate and accept the offer.
  entry_criterion: Offers are received.
  exit_criterion: An offer is accepted.
  outcome: An accepted offer.
  capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  - capabilities:capability-legal-matter-management-zzbd2u
  process_refs:
  - processes:process-ge-build-mctdgc
  customer_visible: true
- name: Close and Settle
  definition: Close the sale and settle proceeds.
  entry_criterion: An offer is accepted.
  exit_criterion: The sale closes with settled proceeds.
  outcome: A closed sale.
  capability_refs:
  - capabilities:capability-legal-matter-management-zzbd2u
  - capabilities:capability-financial-resource-management-cd3c7c
  process_refs:
  - processes:process-fa-operate-sdppmp
  customer_visible: true
