id: value-streams:value-stream-deposit-to-maturity-gsbm8e
type: ValueStream
name: Deposit to Maturity
definition: The end-to-end term-deposit stream from deposit opening through interest accrual to maturity
  and redemption or renewal.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - financial-services
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: A term deposit held to maturity and redeemed or renewed.
entry_criterion: A customer opens a term deposit.
exit_criterion: The deposit matures and is redeemed or renewed.
scope:
  includes:
  - Deposit opening
  - Interest accrual and statements
  - Maturity handling
  - Redemption or renewal
  excludes:
  - Onboarding (Onboard to Activate)
  - Trading-book operations
value_stages:
- name: Open Deposit
  definition: Open and fund the term deposit.
  entry_criterion: A customer opens a term deposit.
  exit_criterion: The deposit is opened and funded.
  outcome: A funded term deposit.
  capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  - capabilities:capability-financial-resource-management-cd3c7c
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
- name: Accrue and Report
  definition: Accrue interest and issue statements.
  entry_criterion: The deposit is funded.
  exit_criterion: Interest accrues and statements issue on schedule.
  outcome: An informed deposit holder.
  capability_refs:
  - capabilities:capability-financial-stewardship-c7xtfk
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-fa-operate-ycba3k
  customer_visible: true
- name: Handle Maturity
  definition: Prepare maturity instructions with the customer.
  entry_criterion: The deposit approaches maturity.
  exit_criterion: Maturity instructions are agreed.
  outcome: Agreed maturity instructions.
  capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  process_refs:
  - processes:process-pr-improve-t6uvan
  customer_visible: true
- name: Redeem or Renew
  definition: Redeem or renew the deposit.
  entry_criterion: Instructions are agreed.
  exit_criterion: The deposit is redeemed or renewed.
  outcome: A settled maturity.
  capability_refs:
  - capabilities:capability-financial-resource-management-cd3c7c
  - capabilities:capability-customer-management-f3n8wb
  process_refs:
  - processes:process-fa-operate-sdppmp
  customer_visible: true
aggregated_capability_refs:
- capabilities:capability-customer-management-f3n8wb
- capabilities:capability-financial-resource-management-cd3c7c
- capabilities:capability-financial-stewardship-c7xtfk
- capabilities:capability-information-management-6vjgdh
metrics:
- name: Deposit renewal rate
  definition: Share of maturing deposits renewed.
evidence:
  sources:
  - SRC-008
  rationale: Admitted under CR-VS-12 (population tranche; candidate VSC-024) from the CR-VS-11 industry
    evidence register extension. Industry-specific chain (financial-services); distinct from cross-industry
    streams by applicability (CR-VS-11 method note); cross-catalog references resolve against the sibling
    catalogs per the referential-integrity gate.
provenance:
  ladder_passage:
