id: value-streams:value-stream-dangerous-goods-accept-to-deliver-txbc4c
type: ValueStream
name: Dangerous Goods Accept to Deliver
definition: The DG stream from acceptance check through compliant handling and documentation to delivered
  consignment.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: governance
applicability:
  industries:
  - logistics-transportation
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: A compliantly delivered dangerous-goods consignment.
entry_criterion: A dangerous-goods booking is made.
exit_criterion: The consignment is delivered compliantly.
scope:
  includes:
  - Acceptance and classification check
  - Compliant handling and segregation
  - Documentation and delivery
  excludes:
  - Standard freight (Ship to Consignee)
  - Incident response (Safety Incident to Closure)
value_stages:
- name: Accept and Classify
  definition: Accept the booking and verify classification and packing.
  entry_criterion: A DG booking is made.
  exit_criterion: The consignment is accepted.
  outcome: An accepted consignment.
  capability_refs:
  - capabilities:capability-regulation-management-gya4d8
  - capabilities:capability-risk-management-h9uxdw
  process_refs:
  - processes:process-ge-operate-tpenm6
  customer_visible: false
- name: Handle Compliantly
  definition: Handle and segregate per class.
  entry_criterion: The consignment is accepted.
  exit_criterion: Handling is compliant.
  outcome: Compliant handling.
  capability_refs:
  - capabilities:capability-security-management-wmzc7c
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-zwzmbd
  - processes:process-eo-operate-zh9m57
  customer_visible: false
- name: Document and Deliver
  definition: Complete DG documentation and deliver.
  entry_criterion: Handling is compliant.
  exit_criterion: The consignment is delivered with papers.
  outcome: A delivered consignment.
  capability_refs:
  - capabilities:capability-regulation-management-gya4d8
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-fa-operate-8vqvkk
  - processes:process-eo-operate-zh9m57
  customer_visible: true
aggregated_capability_refs:
- capabilities:capability-regulation-management-gya4d8
- capabilities:capability-risk-management-h9uxdw
- capabilities:capability-security-management-wmzc7c
- capabilities:capability-operations-management-pm3w8k
- capabilities:capability-information-management-6vjgdh
metrics:
- name: DG documentation accuracy
  definition: Share of consignments with complete compliant papers at delivery.
evidence:
  sources:
  - SRC-016
  rationale: Admitted under CR-VS-12 (population tranche; candidate VSC-071) from the CR-VS-11 industry
    evidence register extension. Industry-specific chain (logistics-transportation); distinct from cross-industry
    streams by applicability (CR-VS-11 method note); cross-catalog references resolve against the sibling
    catalogs per the referential-integrity gate.
