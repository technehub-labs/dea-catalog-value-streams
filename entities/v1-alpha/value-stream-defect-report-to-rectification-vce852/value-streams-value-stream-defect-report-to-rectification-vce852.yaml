  customer_visible: true
- name: Rectify
  definition: Rectify the defect.
  entry_criterion: The inspection is complete.
  exit_criterion: Rectification is complete.
  outcome: A rectified defect.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-2jnz85
  customer_visible: true
- name: Re-inspect and Accept
  definition: Re-inspect and obtain acceptance.
  entry_criterion: Rectification is complete.
