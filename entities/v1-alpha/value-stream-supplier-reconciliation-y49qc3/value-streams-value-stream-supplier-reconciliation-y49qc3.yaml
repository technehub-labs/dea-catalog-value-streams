id: value-streams:value-stream-supplier-reconciliation-y49qc3
type: ValueStream
name: Supplier Reconciliation
definition: The trade-payables reconciliation stream from supplier invoice matching through dispute resolution
  to reconciled settlement.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: support
applicability:
  industries:
  - retail-commerce
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: Reconciled supplier settlements for the trading period.
entry_criterion: Supplier invoices and delivery records exist for the period.
exit_criterion: All supplier accounts are reconciled and settled.
scope:
  includes:
  - Invoice matching
  - Dispute resolution
  - Settlement and reconciliation
  excludes:
  - General procurement (Procure to Pay)
  - Retail buying (Assortment to Shelf)
value_stages:
- name: Match Invoices
  definition: Match supplier invoices to receipts and contracts.
  entry_criterion: Period invoices exist.
  exit_criterion: Invoices are matched.
  outcome: Matched invoices.
  capability_refs:
  - capabilities:capability-financial-resource-management-cd3c7c
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-fa-operate-wkqaqp
  customer_visible: false
- name: Resolve Disputes
  definition: Resolve matching disputes with suppliers.
  entry_criterion: Invoices are matched.
  exit_criterion: Disputes are resolved.
  outcome: Resolved disputes.
  capability_refs:
  - capabilities:capability-supplier-management-d6fuj4
  - capabilities:capability-financial-stewardship-c7xtfk
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: false
- name: Settle and Reconcile
  definition: Settle and reconcile supplier accounts.
  entry_criterion: Disputes are resolved.
  exit_criterion: Accounts are reconciled.
  outcome: Reconciled accounts.
  capability_refs:
  - capabilities:capability-financial-stewardship-c7xtfk
  process_refs:
  - processes:process-fa-operate-wkqaqp
  - processes:process-fa-operate-4xn4d6
  customer_visible: false
aggregated_capability_refs:
- capabilities:capability-financial-resource-management-cd3c7c
- capabilities:capability-information-management-6vjgdh
- capabilities:capability-supplier-management-d6fuj4
- capabilities:capability-financial-stewardship-c7xtfk
metrics:
- name: First-time match rate
  definition: Share of supplier invoices matched without dispute.
  metric_ref: dea:metric-first-time-match-rate
  applies_to_stage: Match Invoices
evidence:
  sources:
  - SRC-013
  rationale: Admitted under CR-VS-12 (population tranche; candidate VSC-060) from the CR-VS-11 industry
    evidence register extension. Industry-specific chain (retail-commerce); distinct from cross-industry
    streams by applicability (CR-VS-11 method note); cross-catalog references resolve against the sibling
    catalogs per the referential-integrity gate.
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-10-28'
    actor: Emmanuel A. Otchere, candidate universe v0.6 (CR-VS-12)
  - stage: admitted
    date: '2026-10-28'
    actor: Emmanuel A. Otchere, admission CR-VS-12
process_refs:
- processes:process-fa-operate-wkqaqp
- processes:process-pr-operate-bbe384
- processes:process-fa-operate-4xn4d6
