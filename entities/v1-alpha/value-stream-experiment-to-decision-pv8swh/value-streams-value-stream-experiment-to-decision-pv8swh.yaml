id: value-streams:value-stream-experiment-to-decision-pv8swh
type: ValueStream
name: Experiment to Decision
definition: The experimentation stream from hypothesis setup through experiment run to a recorded ship/iterate/kill
  decision.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: governance
applicability:
  industries:
  - technology
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: A recorded, evidence-based decision for every experiment.
entry_criterion: A hypothesis is approved.
exit_criterion: The decision is recorded and actioned.
scope:
  includes:
  - Hypothesis and instrumentation
  - Experiment run
  - Analysis and decision
  excludes:
  - Roadmap planning
  - Marketing testing
value_stages:
- name: Set Up Experiment
  definition: Set up the hypothesis and instrumentation.
  entry_criterion: A hypothesis is approved.
  exit_criterion: The experiment is live.
  outcome: A live experiment.
  capability_refs:
  - capabilities:capability-insight-management-ms4n9d
  - capabilities:capability-idea-management-86dckf
  process_refs:
  - processes:process-pv-conceive-kps544
  customer_visible: false
- name: Run
  definition: Run the experiment to significance.
  entry_criterion: The experiment is live.
  exit_criterion: The run is complete.
  outcome: A completed run.
  capability_refs:
  - capabilities:capability-information-management-6vjgdh
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-2jnz85
  customer_visible: false
- name: Analyze and Decide
  definition: Analyze and record the decision.
  entry_criterion: The run is complete.
  exit_criterion: The decision is recorded and actioned.
  outcome: An actioned decision.
  capability_refs:
  - capabilities:capability-insight-management-ms4n9d
