id: value-streams:value-stream-patient-access-to-admission-szj9jm
type: ValueStream
name: Patient Access to Admission
definition: The end-to-end patient access stream from referral or self-scheduling through registration
  to an admitted or scheduled care episode.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - healthcare
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: A patient is registered, verified, and admitted or scheduled for a care episode.
entry_criterion: A referral is received or a patient requests care.
exit_criterion: The patient is admitted or scheduled with registration and coverage verified.
scope:
  includes:
  - Referral or self-scheduling intake
  - Registration and identity verification
  - Coverage verification and pre-authorization
  - Admission or appointment scheduling
  excludes:
  - Emergency stabilization protocols
  - Inpatient care delivery (Admission to Discharge)
value_stages:
- name: Intake and Triage
  definition: Capture the referral or request and triage urgency.
  entry_criterion: A referral is received or a patient requests care.
  exit_criterion: The request is triaged and routed.
  outcome: A triaged, routed access request.
  capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
- name: Register Patient
  definition: Register the patient and verify identity and demographics.
  entry_criterion: A triaged access request exists.
  exit_criterion: The patient record is complete and verified.
  outcome: A verified patient record.
  capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
- name: Verify Coverage
  definition: Verify insurance coverage and obtain pre-authorization where required.
  entry_criterion: A verified patient record exists.
  exit_criterion: Coverage is verified and authorization obtained.
  outcome: Confirmed coverage for the episode.
  capability_refs:
  - capabilities:capability-financial-resource-management-cd3c7c
  - capabilities:capability-customer-management-f3n8wb
  process_refs:
  - processes:process-fa-operate-sdppmp
  customer_visible: true
- name: Schedule or Admit
  definition: Schedule the care episode or admit the patient.
  entry_criterion: Coverage is confirmed.
  exit_criterion: The patient is admitted or scheduled.
  outcome: An admitted or scheduled care episode.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-2jnz85
  customer_visible: true
aggregated_capability_refs:
- capabilities:capability-customer-management-f3n8wb
- capabilities:capability-information-management-6vjgdh
- capabilities:capability-financial-resource-management-cd3c7c
- capabilities:capability-operations-management-pm3w8k
downstream_refs:
- slug: value-stream-admission-to-discharge
  note: Admission starts the care episode.
metrics:
- name: Door-to-provider time
  definition: Elapsed time from patient arrival to first provider contact.
  metric_ref: dea:metric-door-to-provider-time
  applies_to_stage: Intake and Triage
evidence:
  sources:
  - SRC-007
  rationale: Admitted under CR-VS-12 (population tranche; candidate VSC-015) from the CR-VS-11 industry
    evidence register extension. Industry-specific chain (healthcare); distinct from cross-industry streams
    by applicability (CR-VS-11 method note); cross-catalog references resolve against the sibling catalogs
    per the referential-integrity gate.
provenance:
