id: value-streams:value-stream-quote-to-bind-szgnjc
type: ValueStream
name: Quote to Bind
definition: The end-to-end underwriting stream from submission through risk assessment, quote, and bound
  policy.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - insurance
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: A bound policy for the accepted risk.
entry_criterion: A quote request or submission is received.
exit_criterion: The policy is bound and documented.
scope:
  includes:
  - Submission intake
  - Risk assessment and underwriting
  - Quotation and negotiation
  - Binding and documentation
  excludes:
  - Claims (Loss to Claim Settlement)
  - Policy servicing (Policy to Endorsement)
value_stages:
- name: Intake Submission
  definition: Receive and complete the submission.
  entry_criterion: A submission is received.
  exit_criterion: The submission is complete.
  outcome: A complete submission.
  capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
- name: Assess Risk
  definition: Assess the risk and determine terms.
  entry_criterion: The submission is complete.
  exit_criterion: The risk assessment is complete.
  outcome: A completed risk assessment.
  capability_refs:
  - capabilities:capability-risk-management-h9uxdw
  - capabilities:capability-insight-management-ms4n9d
  process_refs:
  - processes:process-ge-operate-tpenm6
  customer_visible: false
- name: Quote
  definition: Quote terms to the customer and negotiate.
  entry_criterion: The assessment is complete.
  exit_criterion: Terms are agreed.
  outcome: Agreed terms.
  capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  - capabilities:capability-financial-resource-management-cd3c7c
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
- name: Bind
  definition: Bind the policy and complete documentation.
  entry_criterion: Terms are agreed.
  exit_criterion: The policy is bound.
  outcome: A bound policy.
  capability_refs:
  - capabilities:capability-legal-matter-management-zzbd2u
  - capabilities:capability-financial-resource-management-cd3c7c
  process_refs:
  - processes:process-ge-build-mctdgc
  customer_visible: true
aggregated_capability_refs:
- capabilities:capability-customer-management-f3n8wb
- capabilities:capability-information-management-6vjgdh
- capabilities:capability-risk-management-h9uxdw
- capabilities:capability-insight-management-ms4n9d
- capabilities:capability-financial-resource-management-cd3c7c
- capabilities:capability-legal-matter-management-zzbd2u
upstream_refs:
- slug: value-stream-policy-to-endorsement
  note: The bound policy is serviced through endorsements.
downstream_refs:
- slug: value-stream-contract-to-renewal
  note: Bound policies renew through the renewal stream.
metrics:
- name: Policy issuance turnaround
  definition: Elapsed time from submission to bound policy.
  metric_ref: dea:metric-policy-issuance-turnaround
  applies_to_stage: Bind
evidence:
  sources:
