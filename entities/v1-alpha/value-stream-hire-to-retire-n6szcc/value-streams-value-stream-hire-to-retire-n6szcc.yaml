id: value-streams:value-stream-hire-to-retire-n6szcc
type: ValueStream
name: Hire to Retire
definition: The end-to-end stream across the employment lifecycle from workforce requisition through hiring,
  development, and separation.
version: 1.3.0
metamodel_pin: 1.0.0
lifecycle_status: active
outcome: A staffed, productive workforce with settled employment obligations.
entry_criterion: A workforce need is identified and a requisition is raised.
exit_criterion: The employment relationship ends and obligations are settled.
aggregated_capability_refs:
- capabilities:capability-workforce-management-9e8d8s
- capabilities:capability-workforce-planning-b43rhm
- capabilities:capability-financial-stewardship-c7xtfk
- capabilities:capability-financial-resource-management-cd3c7c
evidence:
  sources:
  - SRC-006
  rationale: 'Admitted from candidate VSC-006 under CR-VS-03 (evidence at E3/high, distinctness closed
    per CR-VS-02). Served party is internal (manager/employee), distinct from external-customer chains.
    Boundary vs. Procure to Pay: settlement counterparty is the discriminator (CR-VS-02 boundary statement).'
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-10-27'
    actor: 'Emmanuel A. Otchere, candidate universe v0.1 (CR-VS-01, PR #3)'
  - stage: admitted
    date: '2026-10-27'
    actor: Emmanuel A. Otchere, admission CR-VS-03
  - stage: active
    date: '2026-10-27'
    actor: Emmanuel A. Otchere, CR-VS-07 enrichment (value stages, process links, scope, metrics)
  - stage: active
    date: '2026-10-28'
    actor: Emmanuel A. Otchere, CR-VS-08 metric backfill (metric_ref links to dea-catalog-metrics)
  - stage: active
    date: '2026-10-28'
    actor: Emmanuel A. Otchere, CR-VS-11 applicability backfill (cross-industry, generic)
value_stream_category: support
scope:
  includes:
  - Workforce requisition and hiring
  - Onboarding and development
  - Workforce administration and payroll
  - Separation and obligation settlement
  excludes:
  - Supplier settlement (Procure to Pay)
  - Asset lifecycle (Acquire to Retire)
  - Organizational design as a standing concern (Organization Design capability)
value_stages:
- name: Requisition Workforce
  definition: Identify the workforce need and raise the requisition.
  entry_criterion: A workforce need is identified.
  exit_criterion: An approved requisition exists.
  outcome: An approved hiring mandate.
  capability_refs:
  - capabilities:capability-workforce-planning-b43rhm
  - capabilities:capability-workforce-management-9e8d8s
  process_refs:
  - processes:process-ao-conceive-z6m6p5
  customer_visible: false
- name: Hire
  definition: Source, select, and hire against the requisition.
  entry_criterion: An approved requisition exists.
  exit_criterion: A hire is made and employment starts.
  outcome: A staffed position.
  capability_refs:
  - capabilities:capability-workforce-management-9e8d8s
  process_refs:
  - processes:process-ao-conceive-e3u8s2
  customer_visible: false
- name: Develop and Administer
  definition: Develop the workforce and administer employment.
  entry_criterion: Employment has started.
  exit_criterion: The workforce is productive and administered.
  outcome: A productive, administered workforce.
  capability_refs:
  - capabilities:capability-workforce-management-9e8d8s
  - capabilities:capability-financial-resource-management-cd3c7c
  process_refs:
  - processes:process-ao-operate-87q5mk
  - processes:process-ao-operate-dg9q4h
  - processes:process-ao-operate-38qyc6
  customer_visible: false
- name: Separate
  definition: End the employment relationship and settle obligations.
  entry_criterion: A separation is initiated.
  exit_criterion: The employment relationship ends and obligations are settled.
  outcome: A settled separation.
  capability_refs:
  - capabilities:capability-workforce-management-9e8d8s
  - capabilities:capability-financial-stewardship-c7xtfk
  process_refs:
  - processes:process-ao-retire-g3eyr8
  - processes:process-ao-operate-38qyc6
  customer_visible: false
process_refs:
- processes:process-ao-conceive-z6m6p5
- processes:process-ao-conceive-e3u8s2
- processes:process-ao-operate-87q5mk
- processes:process-ao-operate-dg9q4h
- processes:process-ao-operate-38qyc6
- processes:process-ao-retire-g3eyr8
metrics:
- name: Time to hire
  definition: Elapsed days from requisition approval to hire acceptance.
  applies_to_stage: Hire
  metric_ref: dea:metric-time-to-hire
- name: Voluntary turnover rate
  definition: Share of workforce separating voluntarily in period.
  applies_to_stage: Separate
  metric_ref: dea:metric-voluntary-turnover-rate
applicability:
  industries:
  - cross-industry
  organization_types:
  - for-profit-enterprise
  - internal-enterprise
  specificity: generic
