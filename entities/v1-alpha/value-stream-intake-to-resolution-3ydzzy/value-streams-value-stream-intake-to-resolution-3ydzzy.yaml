id: value-streams:value-stream-intake-to-resolution-3ydzzy
type: ValueStream
name: Intake to Resolution
definition: The case-handling stream from case intake through investigation to resolved case with recorded
  outcome.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - public-sector
  organization_types:
  - public-agency
  specificity: industry-specific
outcome: A resolved case with recorded, communicated outcome.
entry_criterion: A case is reported or referred.
exit_criterion: The case is resolved and the outcome recorded.
scope:
  includes:
  - Case registration and triage
  - Investigation
  - Resolution and outcome recording
  excludes:
  - Applications (Apply to Decide)
  - Enforcement referrals
value_stages:
- name: Register Case
  definition: Register and triage the case.
  entry_criterion: A case is reported.
  exit_criterion: The case is registered and triaged.
  outcome: A triaged case.
  capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
- name: Investigate
  definition: Investigate the case.
  entry_criterion: The case is triaged.
  exit_criterion: The investigation is complete.
  outcome: A completed investigation.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  - capabilities:capability-risk-management-h9uxdw
  process_refs:
  - processes:process-ge-operate-zwaes5
  customer_visible: false
- name: Resolve
  definition: Resolve the case and record the outcome.
  entry_criterion: The investigation is complete.
  exit_criterion: The case is resolved with recorded outcome.
  outcome: A resolved case.
  capability_refs:
  - capabilities:capability-enterprise-governance-uas48u
