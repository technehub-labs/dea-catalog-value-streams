id: value-streams:value-stream-commit-to-deploy-65cr4z
type: ValueStream
name: Commit to Deploy
definition: The software delivery stream from code commit through build, test, and release to production
  deployment.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - technology
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: A deployed change in production serving users.
entry_criterion: A change is committed.
exit_criterion: The change is deployed to production.
scope:
  includes:
  - Build and test
  - Release staging
  - Production deployment
  - Verification
  excludes:
  - Incident response (Incident to Restore)
  - Feature development (Concept to Launch)
value_stages:
- name: Build and Test
  definition: Build the change and run the test suites.
  entry_criterion: A change is committed.
  exit_criterion: The change passes tests.
  outcome: A tested change.
  capability_refs:
  - capabilities:capability-technology-enablement-y6nkws
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-build-j9z3q4
  - processes:process-eo-operate-44jsrp
  customer_visible: false
- name: Stage Release
  definition: Stage the release.
  entry_criterion: The change passes tests.
  exit_criterion: The release is staged.
  outcome: A staged release.
  capability_refs:
  - capabilities:capability-technology-management-maus5n
  process_refs:
  - processes:process-eo-design-6j5mxp
  customer_visible: false
- name: Deploy
  definition: Deploy to production.
  entry_criterion: The release is staged.
  exit_criterion: The change is live in production.
  outcome: A deployed change.
  capability_refs:
  - capabilities:capability-technology-enablement-y6nkws
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-xud3hs
  customer_visible: true
- name: Verify
  definition: Verify the deployment in production.
  entry_criterion: The change is deployed.
  exit_criterion: Deployment is verified.
  outcome: A verified deployment.
  capability_refs:
  - capabilities:capability-information-management-6vjgdh
  - capabilities:capability-enterprise-performance-management-5fxren
  process_refs:
  - processes:process-eo-operate-44jsrp
  customer_visible: false
