id: value-streams:value-stream-churn-risk-to-save-pdce5j
type: ValueStream
name: Churn Risk to Save
definition: The retention stream from churn-risk identification through targeted intervention to a saved
  or churned decision.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - telecommunications
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: At-risk customers retained or consciously churned.
entry_criterion: A churn-risk score crosses threshold.
exit_criterion: The customer is retained or churns with the decision recorded.
scope:
  includes:
  - Risk identification
  - Intervention design and offer
  - Outcome tracking
  excludes:
  - Acquisition campaigns
  - Contractual renewal (Contract to Renewal)
value_stages:
- name: Identify Risk
  definition: Identify at-risk customers from behavior and sentiment.
  entry_criterion: A risk threshold is crossed.
  exit_criterion: At-risk customers are identified.
  outcome: An at-risk list.
  capability_refs:
  - capabilities:capability-insight-management-ms4n9d
  - capabilities:capability-customer-management-f3n8wb
  process_refs:
  - processes:process-sd-operate-ucxpz4
  customer_visible: false
- name: Intervene
  definition: Design and deliver the save intervention.
  entry_criterion: The list is identified.
  exit_criterion: Interventions are delivered.
  outcome: Delivered interventions.
  capability_refs:
  - capabilities:capability-marketing-xmc539
  - capabilities:capability-customer-management-f3n8wb
  process_refs:
  - processes:process-pr-improve-t6uvan
  customer_visible: true
- name: Track Outcome
  definition: Track retention outcome per intervention.
  entry_criterion: Interventions are delivered.
  exit_criterion: Outcomes are recorded.
  outcome: Recorded outcomes.
  capability_refs:
  - capabilities:capability-enterprise-performance-management-5fxren
  - capabilities:capability-insight-management-ms4n9d
  process_refs:
  - processes:process-sd-operate-ucxpz4
  customer_visible: false
aggregated_capability_refs:
- capabilities:capability-insight-management-ms4n9d
- capabilities:capability-customer-management-f3n8wb
- capabilities:capability-marketing-xmc539
- capabilities:capability-enterprise-performance-management-5fxren
upstream_refs:
- slug: value-stream-contract-to-renewal
  note: Saved customers flow to term renewal.
metrics:
- name: Churn rate (telecom)
  definition: Subscriber churn per period.
  metric_ref: dea:metric-churn-rate-telecom
  applies_to_stage: Track Outcome
evidence:
  sources:
  - SRC-010
  rationale: Admitted under CR-VS-12 (population tranche; candidate VSC-040) from the CR-VS-11 industry
    evidence register extension. Industry-specific chain (telecommunications); distinct from cross-industry
    streams by applicability (CR-VS-11 method note); cross-catalog references resolve against the sibling
    catalogs per the referential-integrity gate.
provenance:
