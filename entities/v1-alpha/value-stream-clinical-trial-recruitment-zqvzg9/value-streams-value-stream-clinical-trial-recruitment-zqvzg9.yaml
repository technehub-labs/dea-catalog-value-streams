- capabilities:capability-information-management-6vjgdh
- capabilities:capability-customer-management-f3n8wb
- capabilities:capability-legal-matter-management-zzbd2u
upstream_refs:
- slug: value-stream-trial-to-readout
  note: Enrollment completes the trial intake.
metrics:
- name: Clinical trial enrollment cycle time
  definition: Elapsed days from site activation to enrollment target.
  metric_ref: dea:metric-clinical-trial-enrollment-cycle-time
  applies_to_stage: Enroll
evidence:
