id: value-streams:value-stream-record-to-report-zw9z2r
type: ValueStream
name: Record to Report
definition: The end-to-end stream from recording of transactions through period close and attested financial
  reporting.
version: 1.3.0
metamodel_pin: 1.0.0
lifecycle_status: active
outcome: Attested financial visibility for stakeholders.
entry_criterion: An accounting period opens or a transaction is recorded.
exit_criterion: Financial results are reported and attested.
aggregated_capability_refs:
- capabilities:capability-financial-stewardship-c7xtfk
- capabilities:capability-financial-resource-management-cd3c7c
- capabilities:capability-information-management-6vjgdh
- capabilities:capability-enterprise-performance-management-5fxren
- capabilities:capability-enterprise-governance-uas48u
evidence:
  sources:
  - SRC-002
  - SRC-003
  - SRC-006
  rationale: 'Admitted from candidate VSC-009 under CR-VS-04 (evidence raised E2 -> E3 via register v0.2
    extension; distinctness closed per CR-VS-02). Finance reporting chain; served party is enterprise
    governance stakeholders (SRC-003). Boundary vs. Plan to Forecast: backward-looking attestation vs.
    forward-looking commitment (CR-VS-02 RES-002).'
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-10-27'
    actor: 'Emmanuel A. Otchere, candidate universe v0.1 (CR-VS-01, PR #3)'
  - stage: candidate
    date: '2026-10-27'
    actor: Emmanuel A. Otchere, evidence raised E2 -> E3 (CR-VS-04, register v0.2)
  - stage: admitted
    date: '2026-10-27'
    actor: Emmanuel A. Otchere, admission CR-VS-04
  - stage: active
    date: '2026-10-27'
    actor: Emmanuel A. Otchere, CR-VS-07 enrichment (value stages, process links, scope, metrics)
  - stage: active
    date: '2026-10-28'
    actor: Emmanuel A. Otchere, CR-VS-08 metric backfill (metric_ref links to dea-catalog-metrics)
  - stage: active
    date: '2026-10-28'
    actor: Emmanuel A. Otchere, CR-VS-11 applicability backfill (cross-industry, generic)
value_stream_category: governance
scope:
  includes:
  - Transaction recording
  - Period close
  - Attested financial reporting
  - Disclosure and stakeholder visibility
  excludes:
  - Forward-looking commitments (Plan to Forecast)
  - Payment settlement flows (Order to Cash / Procure to Pay)
  - Tax strategy design (Regulation Management capability)
value_stages:
- name: Record Transactions
  definition: Record enterprise transactions in the ledger.
  entry_criterion: An accounting period opens or a transaction occurs.
  exit_criterion: Transactions are recorded in the ledger.
  outcome: A complete transactional record.
  capability_refs:
  - capabilities:capability-financial-stewardship-c7xtfk
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-fa-operate-g9zpnq
  customer_visible: false
- name: Close Period
  definition: Perform period close and reconciliation.
  entry_criterion: The period's transactions are recorded.
  exit_criterion: The period is closed.
  outcome: A closed, reconciled period.
  capability_refs:
  - capabilities:capability-financial-stewardship-c7xtfk
  process_refs:
  - processes:process-fa-operate-4xn4d6
  customer_visible: false
- name: Report
  definition: Compile and attest financial results.
  entry_criterion: A period is closed.
  exit_criterion: Financial results are reported and attested.
  outcome: Attested financial results.
  capability_refs:
  - capabilities:capability-financial-stewardship-c7xtfk
  - capabilities:capability-enterprise-performance-management-5fxren
  process_refs:
  - processes:process-fa-operate-ycba3k
  customer_visible: false
- name: Disclose
  definition: Publish results to stakeholders.
  entry_criterion: Results are attested.
  exit_criterion: Stakeholders have attested visibility.
  outcome: Attested financial visibility for stakeholders.
  capability_refs:
  - capabilities:capability-financial-stewardship-c7xtfk
  - capabilities:capability-enterprise-governance-uas48u
  process_refs:
  - processes:process-fa-operate-8vqvkk
  - processes:process-fa-operate-ycba3k
  customer_visible: true
process_refs:
- processes:process-fa-operate-g9zpnq
- processes:process-fa-operate-4xn4d6
- processes:process-fa-operate-ycba3k
- processes:process-fa-operate-8vqvkk
upstream_refs:
- slug: value-stream-plan-to-forecast
  note: Ratified plans are the commitments attested against.
- slug: value-stream-order-to-cash
  note: Recognized payments are recorded as transactions.
- slug: value-stream-procure-to-pay
  note: Supplier settlements are recorded as transactions.
metrics:
- name: Close cycle time
  definition: Elapsed days from period end to attested close.
  applies_to_stage: Close Period
  metric_ref: dea:metric-financial-close-cycle-time
- name: Restatement rate
  definition: Count of restatements per reporting year; zero is the target.
  applies_to_stage: Report
  metric_ref: dea:metric-financial-restatement-count
applicability:
  industries:
  - cross-industry
  organization_types:
  - for-profit-enterprise
  - internal-enterprise
  specificity: generic
