id: value-streams:value-stream-merchant-acquire-to-transact-ffxrpg
type: ValueStream
name: Merchant Acquire to Transact
definition: The end-to-end merchant-acquiring stream from merchant application through underwriting, terminal
  provisioning, and first transaction.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - financial-services
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: An acquiring relationship live with the merchant's first settled transaction.
entry_criterion: A merchant applies for acceptance.
exit_criterion: The merchant's first transaction is settled.
scope:
  includes:
  - Merchant application and underwriting
  - Terminal or integration provisioning
  - Activation and first transaction
  excludes:
  - Card issuance (Card Issue to Activate)
  - Merchant chargeback handling (Return to Credit pattern)
value_stages:
- name: Underwrite Merchant
  definition: Underwrite the merchant application.
  entry_criterion: A merchant applies.
  exit_criterion: The merchant is underwritten and approved.
  outcome: An approved merchant.
  capability_refs:
  - capabilities:capability-risk-management-h9uxdw
  - capabilities:capability-customer-management-f3n8wb
  process_refs:
  - processes:process-ge-operate-tpenm6
  customer_visible: true
- name: Provision Acceptance
  definition: Provision terminals or API integration.
  entry_criterion: The merchant is approved.
  exit_criterion: Acceptance is provisioned.
  outcome: Provisioned acceptance.
  capability_refs:
  - capabilities:capability-technology-enablement-y6nkws
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-build-j9z3q4
  customer_visible: true
- name: Activate and Transact
  definition: Activate the merchant and process the first transaction.
  entry_criterion: Acceptance is provisioned.
  exit_criterion: The first transaction is settled.
  outcome: A live merchant relationship.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  - capabilities:capability-financial-stewardship-c7xtfk
  process_refs:
  - processes:process-eo-operate-2jnz85
  - processes:process-fa-operate-g9zpnq
  customer_visible: true
aggregated_capability_refs:
- capabilities:capability-risk-management-h9uxdw
- capabilities:capability-customer-management-f3n8wb
- capabilities:capability-technology-enablement-y6nkws
- capabilities:capability-operations-management-pm3w8k
- capabilities:capability-financial-stewardship-c7xtfk
metrics:
- name: Merchant onboarding cycle time
  definition: Elapsed days from application to first settled transaction.
evidence:
  sources:
