id: value-streams:value-stream-supplier-quality-to-approval-t3w9f6
type: ValueStream
name: Supplier Quality to Approval
definition: The supplier stream from quality audit through corrective action to approved-supplier status.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: governance
applicability:
  industries:
