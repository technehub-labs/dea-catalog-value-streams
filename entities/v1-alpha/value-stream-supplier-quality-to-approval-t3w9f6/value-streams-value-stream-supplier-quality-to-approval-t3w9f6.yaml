- name: Agree Actions
  definition: Agree the corrective action plan.
  entry_criterion: The audit is complete.
  exit_criterion: The plan is agreed.
  outcome: An agreed plan.
  capability_refs:
  - capabilities:capability-supplier-management-d6fuj4
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-ge-build-mctdgc
  customer_visible: false
- name: Verify and Approve
  definition: Verify actions and approve the supplier.
