id: value-streams:value-stream-disruption-to-reaccommodation-tuuywj
type: ValueStream
name: Disruption to Reaccommodation
definition: The travel stream from disruption detection through rebooking to the reaccommodated traveler.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - hospitality-travel
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: A reaccommodated traveler completing the journey.
entry_criterion: A journey disruption occurs.
exit_criterion: The traveler completes the journey.
scope:
  includes:
  - Disruption detection and communication
  - Rebooking
  - Compensation handling
  - Journey completion
  excludes:
  - Standard booking
  - Loyalty goodwill
value_stages:
- name: Detect and Communicate
  definition: Detect the disruption and communicate to travelers.
  entry_criterion: A disruption occurs.
  exit_criterion: Travelers are informed.
  outcome: Informed travelers.
  capability_refs:
  - capabilities:capability-information-management-6vjgdh
  - capabilities:capability-customer-management-f3n8wb
  process_refs:
  - processes:process-ge-operate-tpenm6
  customer_visible: true
- name: Rebook
  definition: Rebook affected travelers.
  entry_criterion: Travelers are informed.
  exit_criterion: New arrangements are confirmed.
  outcome: Rebooked travelers.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  - capabilities:capability-customer-management-f3n8wb
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
- name: Handle Compensation
  definition: Handle applicable compensation.
  entry_criterion: Travelers are rebooked.
  exit_criterion: Compensation is settled.
  outcome: Settled compensation.
  capability_refs:
  - capabilities:capability-financial-resource-management-cd3c7c
  - capabilities:capability-customer-management-f3n8wb
  process_refs:
  - processes:process-fa-operate-sdppmp
  customer_visible: true
- name: Complete Journey
  definition: Confirm journey completion.
  entry_criterion: Travelers are rebooked.
  exit_criterion: The journey is completed.
  outcome: A completed journey.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
aggregated_capability_refs:
- capabilities:capability-information-management-6vjgdh
- capabilities:capability-customer-management-f3n8wb
- capabilities:capability-operations-management-pm3w8k
- capabilities:capability-financial-resource-management-cd3c7c
metrics:
- name: Reaccommodation cycle time
  definition: Elapsed time from disruption to confirmed rebooking.
