id: value-streams:value-stream-order-to-cash-sc8gbu
type: ValueStream
name: Order to Cash
definition: >-
  The end-to-end stream from demand generation through order capture, fulfillment, invoicing, and payment settlement.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
outcome: >-
  Customer receives the fulfilled order and the enterprise recognizes payment against it.
entry_criterion: >-
  A customer need converts to an order (request for goods or services); demand generation is the pre-order stage (CR-VS-02 RES-001).
exit_criterion: >-
  Payment is received and recorded against the order.
aggregated_capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  - capabilities:capability-operations-management-pm3w8k
  - capabilities:capability-financial-stewardship-c7xtfk
evidence:
  sources:
    - SRC-002
    - SRC-006
  rationale: >-
    Admitted from candidate VSC-001 under CR-VS-03 (evidence at E3/high,
    distinctness closed per CR-VS-02). Absorbs VSC-007 (Lead to Cash) per CR-VS-02 RES-001. Boundary vs. VSC-005 (Plan to Deliver): fulfillment is shared vocabulary; this stream exits at payment recognition (CR-VS-02 boundary statement).
