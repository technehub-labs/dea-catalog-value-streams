id: value-streams:value-stream-trouble-to-restore-gtrgd8
type: ValueStream
name: Trouble to Restore
definition: The telecom assurance stream from fault report through diagnosis and repair to restored service.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - telecommunications
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: Restored service confirmed to the customer.
entry_criterion: A fault is reported or detected.
exit_criterion: Service is restored and confirmed.
scope:
  includes:
  - Fault localization
  - Diagnosis and dispatch
  - Repair
  - Restoration confirmation
  excludes:
  - Planned maintenance
  - Customer complaint handling (Issue to Resolve)
value_stages:
- name: Localize Fault
  definition: Localize the reported or detected fault.
  entry_criterion: A fault is reported.
  exit_criterion: The fault is localized.
  outcome: A localized fault.
  capability_refs:
  - capabilities:capability-technology-management-maus5n
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-eo-operate-4njp7b
  customer_visible: true
- name: Diagnose and Dispatch
  definition: Diagnose root cause and dispatch repair.
  entry_criterion: The fault is localized.
  exit_criterion: Repair is dispatched.
  outcome: A dispatched repair.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  - capabilities:capability-workforce-management-9e8d8s
  process_refs:
  - processes:process-eo-operate-2jnz85
  customer_visible: false
- name: Repair
  definition: Execute the repair.
  entry_criterion: Repair is dispatched.
  exit_criterion: The repair is complete.
  outcome: A completed repair.
  capability_refs:
  - capabilities:capability-technology-enablement-y6nkws
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-j9cjzz
  customer_visible: false
- name: Confirm Restoration
  definition: Confirm service restoration with the customer.
  entry_criterion: The repair is complete.
  exit_criterion: Service is restored and confirmed.
  outcome: Restored service.
  capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
aggregated_capability_refs:
- capabilities:capability-technology-management-maus5n
- capabilities:capability-information-management-6vjgdh
- capabilities:capability-operations-management-pm3w8k
- capabilities:capability-workforce-management-9e8d8s
- capabilities:capability-technology-enablement-y6nkws
- capabilities:capability-customer-management-f3n8wb
metrics:
- name: Mean time to restore service
  definition: Mean elapsed time from fault to restoration.
  metric_ref: dea:metric-mean-time-to-restore-service
  applies_to_stage: Confirm Restoration
evidence:
