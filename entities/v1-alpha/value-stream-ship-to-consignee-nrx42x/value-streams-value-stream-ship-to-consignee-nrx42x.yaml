id: value-streams:value-stream-ship-to-consignee-nrx42x
type: ValueStream
name: Ship to Consignee
definition: The freight stream from shipper booking through pickup, linehaul, and delivery to consignee
  receipt.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - logistics-transportation
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: Freight delivered with confirmed consignee receipt.
entry_criterion: A shipper books the freight.
exit_criterion: The consignee confirms receipt.
scope:
  includes:
  - Booking
  - Pickup and linehaul
  - Delivery
  - Proof of delivery
  excludes:
  - Customs clearance (Customs Clearance to Release)
  - Warehousing (Warehouse Inbound to Bin)
value_stages:
- name: Book Freight
  definition: Book the freight movement.
  entry_criterion: A shipper books.
  exit_criterion: The booking is confirmed.
  outcome: A confirmed booking.
  capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
- name: Pick Up and Linehaul
  definition: Pick up and linehaul the freight.
  entry_criterion: The booking is confirmed.
  exit_criterion: The freight arrives at destination.
  outcome: Arrived freight.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-zh9m57
  customer_visible: false
- name: Deliver
  definition: Deliver to the consignee.
  entry_criterion: The freight arrives.
  exit_criterion: The consignee receives.
  outcome: Received freight.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-zh9m57
  customer_visible: true
- name: Confirm Proof
  definition: Confirm proof of delivery.
  entry_criterion: The consignee receives.
  exit_criterion: Proof is recorded.
  outcome: Recorded proof.
  capability_refs:
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
aggregated_capability_refs:
- capabilities:capability-customer-management-f3n8wb
- capabilities:capability-operations-management-pm3w8k
- capabilities:capability-information-management-6vjgdh
upstream_refs:
- slug: value-stream-customs-clearance-to-release
  note: Cross-border freight clears customs en route.
metrics:
- name: On-time delivery rate (freight)
  definition: Share of freight delivered within the promised window.
  metric_ref: dea:metric-on-time-delivery-rate
  applies_to_stage: Deliver
evidence:
  sources:
  - SRC-016
  rationale: Admitted under CR-VS-12 (population tranche; candidate VSC-066) from the CR-VS-11 industry
    evidence register extension. Industry-specific chain (logistics-transportation); distinct from cross-industry
    streams by applicability (CR-VS-11 method note); cross-catalog references resolve against the sibling
    catalogs per the referential-integrity gate.
provenance:
  ladder_passage:
