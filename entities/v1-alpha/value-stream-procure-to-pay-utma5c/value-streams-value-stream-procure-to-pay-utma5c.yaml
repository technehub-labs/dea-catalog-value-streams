id: value-streams:value-stream-procure-to-pay-utma5c
type: ValueStream
name: Procure to Pay
definition: The end-to-end stream from identification of an external supply need through sourcing, ordering,
  receipt, and supplier payment.
version: 1.2.0
metamodel_pin: 1.0.0
lifecycle_status: active
outcome: The internal need is met and the supplier obligation is settled.
entry_criterion: An internal need for external supply is identified and a requisition is raised.
exit_criterion: The supplier is paid and the need is met.
aggregated_capability_refs:
- capabilities:capability-sourcing-and-procurement-esucp4
- capabilities:capability-operations-management-pm3w8k
- capabilities:capability-financial-stewardship-c7xtfk
- capabilities:capability-financial-resource-management-cd3c7c
- capabilities:capability-supplier-management-d6fuj4
evidence:
  sources:
  - SRC-002
  - SRC-006
  rationale: 'Admitted from candidate VSC-002 under CR-VS-03 (evidence at E3/high, distinctness closed
    per CR-VS-02). Counterpart of Order to Cash on the supply side. Boundary vs. Hire to Retire: settlement
    is shared vocabulary; the counterparty (supplier vs. employee) is the discriminator (CR-VS-02 boundary
    statement).'
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-10-27'
    actor: 'Emmanuel A. Otchere, candidate universe v0.1 (CR-VS-01, PR #3)'
  - stage: admitted
    date: '2026-10-27'
    actor: Emmanuel A. Otchere, admission CR-VS-03
  - stage: active
    date: '2026-10-27'
    actor: Emmanuel A. Otchere, CR-VS-07 enrichment (value stages, process links, scope, metrics)
  - stage: active
    date: '2026-10-28'
    actor: Emmanuel A. Otchere, CR-VS-08 metric backfill (metric_ref links to dea-catalog-metrics)
value_stream_category: operational
scope:
  includes:
  - Requisition of external supply
  - Sourcing and supplier selection
  - Purchase ordering and receipt
  - Supplier invoice settlement
  excludes:
  - Employee lifecycle settlement (Hire to Retire)
  - Asset-lifecycle custody after receipt (Acquire to Retire)
  - Demand-side flows (Order to Cash)
value_stages:
- name: Requisition Need
  definition: Identify and approve the internal need for external supply.
  entry_criterion: An internal need for external supply is identified.
  exit_criterion: An approved requisition exists.
  outcome: An approved, fundable requisition.
  capability_refs:
  - capabilities:capability-sourcing-and-procurement-esucp4
  - capabilities:capability-financial-resource-management-cd3c7c
  process_refs:
  - processes:process-eo-operate-vzcxx7
  customer_visible: false
- name: Source Supplier
  definition: Select the supplier and agree commercial terms.
  entry_criterion: An approved requisition exists.
  exit_criterion: A supplier and terms are selected.
  outcome: A sourced supply commitment.
  capability_refs:
  - capabilities:capability-sourcing-and-procurement-esucp4
  - capabilities:capability-supplier-management-d6fuj4
  process_refs:
  - processes:process-eo-operate-vzcxx7
  customer_visible: false
- name: Order and Receive
  definition: Place the purchase order and receive the goods or services.
  entry_criterion: A sourcing decision exists.
  exit_criterion: The goods or services are received and verified.
  outcome: Verified receipt against the order.
  capability_refs:
  - capabilities:capability-sourcing-and-procurement-esucp4
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-vzcxx7
  - processes:process-eo-operate-zwzmbd
  customer_visible: false
- name: Settle Supplier
  definition: Match, approve, and pay the supplier invoice.
  entry_criterion: A verified receipt exists.
  exit_criterion: The supplier is paid and the need is met.
  outcome: A settled supplier obligation.
  capability_refs:
  - capabilities:capability-financial-stewardship-c7xtfk
  - capabilities:capability-supplier-management-d6fuj4
  process_refs:
  - processes:process-fa-operate-wkqaqp
  - processes:process-fa-operate-g9zpnq
  customer_visible: false
process_refs:
- processes:process-eo-operate-vzcxx7
- processes:process-eo-operate-zwzmbd
- processes:process-fa-operate-wkqaqp
- processes:process-fa-operate-g9zpnq
downstream_refs:
- slug: value-stream-acquire-to-retire
  note: Received assets enter the asset lifecycle.
metrics:
- name: Procure-to-pay cycle time
  definition: Elapsed time from requisition approval to supplier payment.
  applies_to_stage: Settle Supplier
  metric_ref: dea:metric-invoice-processing-cycle-time
- name: First-time match rate
  definition: Share of supplier invoices matched to PO and receipt without exception.
  applies_to_stage: Settle Supplier
  metric_ref: dea:metric-first-time-match-rate
