id: value-streams:value-stream-procure-to-pay-utma5c
type: ValueStream
name: Procure to Pay
definition: >-
  The end-to-end stream from identification of an external supply need through sourcing, ordering, receipt, and supplier payment.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
outcome: >-
  The internal need is met and the supplier obligation is settled.
entry_criterion: >-
  An internal need for external supply is identified and a requisition is raised.
exit_criterion: >-
  The supplier is paid and the need is met.
aggregated_capability_refs:
