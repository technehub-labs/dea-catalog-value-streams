  - capabilities:capability-financial-stewardship-c7xtfk
evidence:
  sources:
    - SRC-002
    - SRC-006
  rationale: >-
    Admitted from candidate VSC-002 under CR-VS-03 (evidence at E3/high,
    distinctness closed per CR-VS-02). Counterpart of Order to Cash on the supply side. Boundary vs. Hire to Retire: settlement is shared vocabulary; the counterparty (supplier vs. employee) is the discriminator (CR-VS-02 boundary statement).
