id: value-streams:value-stream-alert-to-report-a2qttg
type: ValueStream
name: Alert to Report
definition: The financial-crime stream from alert detection through investigation to the reporting decision.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: governance
applicability:
  industries:
  - financial-services
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: A completed, defensible reporting decision on every financial-crime alert.
entry_criterion: A monitoring alert is generated.
exit_criterion: The reporting decision is made and filed where required.
scope:
  includes:
  - Alert triage
  - Investigation
  - Decision and quality review
  - Regulatory filing or closure
  excludes:
  - Customer onboarding due diligence (Onboard to Activate)
  - General risk reporting
value_stages:
- name: Triage Alert
  definition: Triage the monitoring alert.
  entry_criterion: An alert is generated.
  exit_criterion: The alert is triaged.
  outcome: A triaged alert.
  capability_refs:
  - capabilities:capability-risk-management-h9uxdw
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-ge-operate-tpenm6
  customer_visible: false
- name: Investigate
  definition: Investigate the alerted activity.
  entry_criterion: The alert is triaged.
  exit_criterion: The investigation is complete.
  outcome: A completed investigation.
  capability_refs:
  - capabilities:capability-risk-management-h9uxdw
  - capabilities:capability-insight-management-ms4n9d
  process_refs:
  - processes:process-ge-operate-zwaes5
  customer_visible: false
- name: Decide and Review
  definition: Make the reporting decision with quality review.
  entry_criterion: The investigation is complete.
  exit_criterion: The decision is made and reviewed.
  outcome: A reviewed decision.
  capability_refs:
  - capabilities:capability-risk-management-h9uxdw
  - capabilities:capability-enterprise-governance-uas48u
  process_refs:
  - processes:process-ge-operate-zwaes5
  customer_visible: false
- name: File or Close
  definition: File the report or close with rationale.
  entry_criterion: The decision is made.
  exit_criterion: The report is filed or the alert closed with rationale.
  outcome: A dispositioned alert.
  capability_refs:
  - capabilities:capability-regulation-management-gya4d8
  - capabilities:capability-risk-management-h9uxdw
  process_refs:
  - processes:process-fa-operate-8vqvkk
  customer_visible: false
