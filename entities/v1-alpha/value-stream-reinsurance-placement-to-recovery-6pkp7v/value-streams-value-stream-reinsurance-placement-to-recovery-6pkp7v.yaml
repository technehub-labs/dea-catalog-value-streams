id: value-streams:value-stream-reinsurance-placement-to-recovery-6pkp7v
type: ValueStream
name: Reinsurance Placement to Recovery
definition: The reinsurance stream from placement negotiation through premium settlement to loss recovery.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - insurance
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: Ceded risk with recoveries collected.
entry_criterion: A reinsurance need is identified.
exit_criterion: Recoveries are collected for ceded losses.
scope:
  includes:
  - Placement negotiation
  - Contract execution and premium settlement
  - Loss reporting
  - Recovery collection
  excludes:
  - Direct underwriting (Quote to Bind)
  - Direct claims (Loss to Claim Settlement)
value_stages:
- name: Place Cover
  definition: Negotiate and place the reinsurance cover.
  entry_criterion: A need is identified.
  exit_criterion: The cover is placed.
  outcome: Placed cover.
  capability_refs:
  - capabilities:capability-partner-management-cp3vdb
  - capabilities:capability-risk-management-h9uxdw
  process_refs:
  - processes:process-ge-build-mctdgc
  customer_visible: false
- name: Settle Premium
  definition: Execute the contract and settle premium.
  entry_criterion: The cover is placed.
  exit_criterion: The contract is executed and premium settled.
  outcome: An executed treaty.
  capability_refs:
  - capabilities:capability-legal-matter-management-zzbd2u
  - capabilities:capability-financial-stewardship-c7xtfk
  process_refs:
  - processes:process-ge-build-mctdgc
  - processes:process-fa-operate-wkqaqp
  customer_visible: false
- name: Report Losses
  definition: Report ceded losses to the reinsurer.
  entry_criterion: A covered loss occurs.
  exit_criterion: The loss is reported.
  outcome: A reported ceded loss.
  capability_refs:
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: false
- name: Collect Recovery
  definition: Collect the reinsurance recovery.
  entry_criterion: The loss is reported.
  exit_criterion: The recovery is collected.
  outcome: A collected recovery.
  capability_refs:
  - capabilities:capability-financial-stewardship-c7xtfk
  process_refs:
  - processes:process-fa-operate-sdppmp
  customer_visible: false
aggregated_capability_refs:
- capabilities:capability-partner-management-cp3vdb
- capabilities:capability-risk-management-h9uxdw
- capabilities:capability-legal-matter-management-zzbd2u
- capabilities:capability-financial-stewardship-c7xtfk
- capabilities:capability-information-management-6vjgdh
metrics:
- name: Recovery collection cycle time
  definition: Elapsed time from loss report to collected recovery.
