id: value-streams:value-stream-sample-to-result-4wf8jc
type: ValueStream
name: Sample to Result
definition: The diagnostics stream from sample accessioning through testing to a released, communicated
  result.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - life-sciences
  - healthcare
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: A released result communicated to the ordering clinician.
entry_criterion: A sample is received.
exit_criterion: The result is released and communicated.
scope:
  includes:
  - Accessioning
  - Testing
  - Result review and release
  excludes:
  - Patient treatment (Referral to Treatment)
  - Clinical trials lab work
value_stages:
- name: Accession Sample
  definition: Accession and register the sample.
  entry_criterion: A sample is received.
  exit_criterion: The sample is accessioned.
  outcome: An accessioned sample.
  capability_refs:
  - capabilities:capability-information-management-6vjgdh
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-zwzmbd
  customer_visible: false
- name: Test
  definition: Perform the diagnostic testing.
  entry_criterion: The sample is accessioned.
  exit_criterion: Testing is complete.
  outcome: Test results.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  - capabilities:capability-technology-enablement-y6nkws
  process_refs:
  - processes:process-eo-operate-44jsrp
  - processes:process-eo-operate-xud3hs
  customer_visible: false
- name: Review and Release
  definition: Review and release the result.
  entry_criterion: Testing is complete.
  exit_criterion: The result is released and communicated.
  outcome: A communicated result.
  capability_refs:
  - capabilities:capability-risk-management-h9uxdw
