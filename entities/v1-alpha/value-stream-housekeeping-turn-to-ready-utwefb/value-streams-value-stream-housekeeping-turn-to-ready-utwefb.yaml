id: value-streams:value-stream-housekeeping-turn-to-ready-utwefb
type: ValueStream
name: Housekeeping Turn to Ready
definition: The housekeeping stream from checkout through cleaning and inspection to ready-to-sell status.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: support
applicability:
  industries:
  - hospitality-travel
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: A ready-to-sell room at standard.
entry_criterion: A guest checks out.
exit_criterion: The room is ready to sell.
scope:
  includes:
  - Cleaning
  - Inspection
  - Ready status
  excludes:
  - Maintenance (Grid Maintenance pattern)
  - Lodging service (Book to Stay)
value_stages:
- name: Clean
  definition: Clean the departed room.
  entry_criterion: A checkout occurs.
  exit_criterion: The room is cleaned.
  outcome: A cleaned room.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-2jnz85
  customer_visible: false
- name: Inspect
  definition: Inspect against the room standard.
  entry_criterion: The room is cleaned.
  exit_criterion: The room passes inspection.
  outcome: A passed inspection.
  capability_refs:
  - capabilities:capability-risk-management-h9uxdw
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-44jsrp
  customer_visible: false
- name: Mark Ready
  definition: Mark the room ready to sell.
  entry_criterion: The inspection passes.
  exit_criterion: The room is ready.
  outcome: A ready room.
  capability_refs:
  - capabilities:capability-information-management-6vjgdh
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-eo-operate-zwzmbd
  customer_visible: false
