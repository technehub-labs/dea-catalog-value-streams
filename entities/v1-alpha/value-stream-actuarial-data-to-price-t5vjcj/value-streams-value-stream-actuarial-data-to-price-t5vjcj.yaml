id: value-streams:value-stream-actuarial-data-to-price-t5vjcj
type: ValueStream
name: Actuarial Data to Price
definition: The pricing-governance stream from experience-data compilation through actuarial analysis
  to filed/adopted rates.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: governance
applicability:
  industries:
  - insurance
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: Filed or adopted, defensible rates.
entry_criterion: A pricing review cycle opens.
exit_criterion: Rates are filed or adopted.
scope:
  includes:
  - Experience data compilation
  - Actuarial analysis
  - Rate proposal
  - Filing and adoption
  excludes:
  - Claims data operations
  - Regulatory reporting
value_stages:
- name: Compile Data
  definition: Compile claims and exposure experience data.
  entry_criterion: A pricing cycle opens.
  exit_criterion: The dataset is compiled.
  outcome: A compiled dataset.
  capability_refs:
  - capabilities:capability-information-management-6vjgdh
  - capabilities:capability-insight-management-ms4n9d
  process_refs:
  - processes:process-sd-operate-ucxpz4
  customer_visible: false
- name: Analyze
  definition: Perform the actuarial analysis.
  entry_criterion: The dataset is compiled.
  exit_criterion: The analysis is complete.
  outcome: A completed analysis.
  capability_refs:
  - capabilities:capability-insight-management-ms4n9d
  - capabilities:capability-risk-management-h9uxdw
  process_refs:
  - processes:process-fa-conceive-4uqqvg
  customer_visible: false
- name: Propose Rates
  definition: Propose the rate changes.
  entry_criterion: The analysis is complete.
  exit_criterion: The proposal is ready.
  outcome: A rate proposal.
  capability_refs:
  - capabilities:capability-financial-resource-management-cd3c7c
  process_refs:
  - processes:process-fa-conceive-4uqqvg
  customer_visible: false
- name: File and Adopt
  definition: File or adopt the rates.
  entry_criterion: The proposal is ready.
  exit_criterion: Rates are filed or adopted.
  outcome: Adopted rates.
  capability_refs:
  - capabilities:capability-regulation-management-gya4d8
  - capabilities:capability-legal-matter-management-zzbd2u
