  rationale: Admitted under CR-VS-12 (population tranche; candidate VSC-023) from the CR-VS-11 industry
    evidence register extension. Industry-specific chain (financial-services); distinct from cross-industry
    streams by applicability (CR-VS-11 method note); cross-catalog references resolve against the sibling
    catalogs per the referential-integrity gate.
