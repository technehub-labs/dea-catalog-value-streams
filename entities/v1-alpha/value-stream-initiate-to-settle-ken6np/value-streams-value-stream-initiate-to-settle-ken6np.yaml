id: value-streams:value-stream-initiate-to-settle-ken6np
type: ValueStream
name: Initiate to Settle
definition: The end-to-end payments stream from payment initiation through clearing and settlement to
  reconciled completion.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - financial-services
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: A settled, reconciled payment between parties.
entry_criterion: A payment is initiated.
exit_criterion: The payment is settled and reconciled.
scope:
  includes:
  - Payment initiation and validation
  - Clearing
  - Settlement
  - Reconciliation
  excludes:
  - Trade capture
  - Card network disputes
value_stages:
- name: Initiate Payment
  definition: Receive and validate the payment instruction.
  entry_criterion: A payment is initiated.
  exit_criterion: The instruction is validated.
  outcome: A validated payment instruction.
  capability_refs:
  - capabilities:capability-customer-management-f3n8wb
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: true
- name: Clear
  definition: Route the payment through clearing.
  entry_criterion: The instruction is validated.
  exit_criterion: The payment is cleared.
  outcome: A cleared payment.
  capability_refs:
  - capabilities:capability-operations-management-pm3w8k
  - capabilities:capability-technology-management-maus5n
  process_refs:
  - processes:process-eo-operate-2jnz85
  customer_visible: false
- name: Settle
  definition: Settle the payment between accounts.
  entry_criterion: The payment is cleared.
  exit_criterion: Settlement completes.
  outcome: A settled payment.
  capability_refs:
  - capabilities:capability-financial-stewardship-c7xtfk
  - capabilities:capability-operations-management-pm3w8k
  process_refs:
  - processes:process-fa-operate-g9zpnq
  customer_visible: false
- name: Reconcile
  definition: Reconcile settlement against instructions.
  entry_criterion: Settlement completes.
  exit_criterion: The payment is reconciled.
  outcome: A reconciled payment.
  capability_refs:
  - capabilities:capability-financial-stewardship-c7xtfk
  - capabilities:capability-information-management-6vjgdh
  process_refs:
  - processes:process-fa-operate-4xn4d6
  customer_visible: false
aggregated_capability_refs:
- capabilities:capability-customer-management-f3n8wb
- capabilities:capability-information-management-6vjgdh
- capabilities:capability-operations-management-pm3w8k
- capabilities:capability-technology-management-maus5n
- capabilities:capability-financial-stewardship-c7xtfk
metrics:
- name: Payment settlement cycle time
  definition: Elapsed time from initiation to reconciled settlement.
