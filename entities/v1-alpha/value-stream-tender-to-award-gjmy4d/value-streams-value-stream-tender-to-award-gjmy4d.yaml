id: value-streams:value-stream-tender-to-award-gjmy4d
type: ValueStream
name: Tender to Award
definition: The construction stream from tender invitation through bid preparation and evaluation to contract
  award.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
value_stream_category: operational
applicability:
  industries:
  - construction-real-estate
  organization_types:
  - regulated-entity
  - for-profit-enterprise
  specificity: industry-specific
outcome: An awarded construction contract.
entry_criterion: A tender is invited.
exit_criterion: The contract is awarded.
scope:
  includes:
  - Bid preparation
  - Submission
  - Evaluation and clarification
  - Award
  excludes:
  - Project execution (Build to Handover)
  - Framework agreements
value_stages:
- name: Prepare Bid
  definition: Prepare the bid against the tender.
  entry_criterion: A tender is invited.
  exit_criterion: The bid is ready.
  outcome: A prepared bid.
  capability_refs:
