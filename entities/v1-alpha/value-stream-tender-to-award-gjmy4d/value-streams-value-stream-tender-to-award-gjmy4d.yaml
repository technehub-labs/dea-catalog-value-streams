  customer_visible: false
- name: Submit
  definition: Submit the bid.
  entry_criterion: The bid is ready.
  exit_criterion: The bid is submitted.
  outcome: A submitted bid.
  capability_refs:
  - capabilities:capability-partner-management-cp3vdb
  process_refs:
  - processes:process-pr-operate-bbe384
  customer_visible: false
- name: Evaluate and Clarify
  definition: Respond to evaluation clarification.
  entry_criterion: The bid is submitted.
  exit_criterion: Clarifications are closed.
  outcome: Closed clarifications.
  capability_refs:
  - capabilities:capability-legal-matter-management-zzbd2u
